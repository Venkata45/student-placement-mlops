name: Student Placement ML CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Get project code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dataset
        run: |
          python -c "import pandas as pd; df=pd.read_csv('placement_data.csv'); print('Rows:', len(df)); print('Columns:', list(df.columns))"

      - name: Train ML model
        run: |
          python placement_model.py

      - name: Run automated tests
        run: |
          python -m unittest discover -v
